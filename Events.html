<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZONE-431 | Rapports d'événements</title>

    <link rel="stylesheet" href="Events.css">
</head>

<body class="events-page">

    <!-- =========================================================
         BARRE DE NAVIGATION
    ========================================================== -->

    <header class="topbar">

        <div class="logo">
            ZONE-431
        </div>

        <nav>
            <a href="accueil.html">ACCUEIL</a>
            <a href="menu.html">LA ZONE</a>
            <a href="département.html">DÉPARTEMENTS</a>
            <a href="documents.html">DOCUMENTS</a>
            <a href="contact.html">CONTACT</a>
            <a href="zone staff.html">ZONE STAFF</a>
        </nav>

    </header>


    <!-- =========================================================
         EN-TÊTE
    ========================================================== -->

    <header class="page-header">

        <div>
            <div class="section-label">
                ZONE STAFF
            </div>

            <h1>
                RAPPORTS D'ÉVÉNEMENTS
            </h1>

            <p>
                ARCHIVES DES ÉVÉNEMENTS ORGANISÉS AU SEIN DE LA ZONE-431
            </p>
        </div>

        <div id="accessStatus" class="access-status">
            VÉRIFICATION DES AUTORISATIONS...
        </div>

    </header>


    <!-- =========================================================
         CONTENU
    ========================================================== -->

    <main id="eventsContent" class="events-content hidden">

        <!-- BARRE SUPÉRIEURE -->

        <div class="events-top">

            <div>

                <div class="section-label">
                    ARCHIVES
                </div>

                <h2>
                    RAPPORTS D'ÉVÉNEMENTS
                </h2>

            </div>


            <div class="events-actions">

                <input
                    type="text"
                    id="searchInput"
                    class="search-box"
                    placeholder="Rechercher un rapport..."
                    oninput="searchReports()"
                >

                <button
                    id="createReportButton"
                    type="button"
                    class="create-button hidden"
                    onclick="openCreateReport()"
                >
                    + NOUVEAU RAPPORT
                </button>

            </div>

        </div>


        <!-- LISTE DES RAPPORTS -->

        <section id="reportsList" class="reports-list">

            <div class="loading">
                CHARGEMENT DES RAPPORTS...
            </div>

        </section>

    </main>


    <!-- =========================================================
         MODALE RAPPORT
    ========================================================== -->

    <div id="reportModal" class="modal hidden">

        <div class="modal-background" onclick="closeReportModal()"></div>

        <div class="modal-box large-modal">

            <button
                type="button"
                class="modal-close"
                onclick="closeReportModal()"
            >
                ×
            </button>


            <div class="section-label">
                ZONE-431
            </div>

            <h2 id="reportModalTitle">
                NOUVEAU RAPPORT
            </h2>


            <!-- FORMULAIRE -->

            <form id="eventReportForm" onsubmit="saveReport(event)">

                <input
                    type="hidden"
                    id="editingReportId"
                >


                <!-- NOM -->

                <label class="modal-label" for="eventName">
                    NOM DE L'ÉVÉNEMENT
                </label>

                <input
                    type="text"
                    id="eventName"
                    required
                    autocomplete="off"
                >


                <!-- DATE -->

                <label class="modal-label">
                    DATE DE L'ÉVÉNEMENT
                </label>

                <div class="date-inputs">

                    <input
                        type="number"
                        id="eventDay"
                        placeholder="JJ"
                        min="1"
                        max="31"
                        required
                    >

                    <input
                        type="number"
                        id="eventMonth"
                        placeholder="MM"
                        min="1"
                        max="12"
                        required
                    >

                    <input
                        type="number"
                        id="eventYear"
                        placeholder="AAAA"
                        min="2020"
                        max="2100"
                        required
                    >

                </div>


                <!-- RESPONSABLE -->

                <label class="modal-label" for="eventLeader">
                    RESPONSABLE
                </label>

                <input
                    type="text"
                    id="eventLeader"
                    required
                    autocomplete="off"
                >


                <!-- PARTICIPANTS -->

                <label class="modal-label" for="eventParticipants">
                    NOMBRE DE PARTICIPANTS
                </label>

                <input
                    type="number"
                    id="eventParticipants"
                    min="0"
                    value="0"
                    required
                >


                <!-- RÉSUMÉ -->

                <label class="modal-label" for="eventSummary">
                    RÉSUMÉ
                </label>

                <textarea
                    id="eventSummary"
                    rows="4"
                    required
                ></textarea>


                <!-- DÉROULEMENT -->

                <label class="modal-label" for="eventProgress">
                    DÉROULEMENT
                </label>

                <textarea
                    id="eventProgress"
                    rows="6"
                    required
                ></textarea>


                <!-- INCIDENTS -->

                <label class="modal-label" for="eventIncidents">
                    INCIDENTS
                </label>

                <textarea
                    id="eventIncidents"
                    rows="4"
                    placeholder="Aucun incident à signaler..."
                ></textarea>


                <!-- COMMENTAIRES -->

                <label class="modal-label" for="eventComments">
                    COMMENTAIRES
                </label>

                <textarea
                    id="eventComments"
                    rows="4"
                ></textarea>


                <!-- STATUT -->

                <label class="modal-label" for="eventStatus">
                    STATUT
                </label>

                <select id="eventStatus">

                    <option value="TERMINE">
                        TERMINÉ
                    </option>

                    <option value="EN COURS">
                        EN COURS
                    </option>

                    <option value="ANNULE">
                        ANNULÉ
                    </option>

                    <option value="INCIDENT">
                        INCIDENT
                    </option>

                </select>


                <!-- BOUTONS -->

                <div class="form-actions">

                    <button
                        type="button"
                        class="cancel-button"
                        onclick="closeReportModal()"
                    >
                        ANNULER
                    </button>

                    <button
                        type="submit"
                        class="save-button"
                    >
                        ENREGISTRER
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =========================================================
         SUPABASE
    ========================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =========================================================
           CONFIGURATION SUPABASE
        ========================================================== */

        const SUPABASE_URL =
            'https://pvtrlplsplyigvxiykce.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_iwAj_zFrWEsMcqUKNINwJw_Po3QAwDG';

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================================================
           VARIABLES
        ========================================================== */

        let currentRole = null;
        let allReports = [];


        /*
         * Rôles autorisés à accéder aux rapports.
         */
        const ALLOWED_ROLES = [
            'ANIMATION',
            'MANAGER ANIM',
            'ADMINISTRATEUR'
        ];


        /*
         * Rôles autorisés à créer / modifier.
         */
        const EDIT_ROLES = [
            'ANIMATION',
            'MANAGER ANIM',
            'ADMINISTRATEUR'
        ];


        /*
         * Rôles autorisés à supprimer.
         */
        const DELETE_ROLES = [
            'MANAGER ANIM',
            'ADMINISTRATEUR'
        ];


        /* =========================================================
           VÉRIFICATION DU RÔLE
        ========================================================== */

        function checkStaffRole() {

            const role =
                sessionStorage.getItem('zone431_role');


            if (!ALLOWED_ROLES.includes(role)) {

                window.location.href =
                    'zone staff.html';

                return false;
            }


            currentRole = role;

            return true;
        }


        /* =========================================================
           INITIALISATION
        ========================================================== */

        document.addEventListener(
            'DOMContentLoaded',
            async function () {

                if (!checkStaffRole()) {
                    return;
                }


                const eventsContent =
                    document.getElementById(
                        'eventsContent'
                    );

                const accessStatus =
                    document.getElementById(
                        'accessStatus'
                    );

                const createButton =
                    document.getElementById(
                        'createReportButton'
                    );


                /*
                 * Tout le monde ayant accès peut créer.
                 */
                if (EDIT_ROLES.includes(currentRole)) {

                    createButton.classList.remove(
                        'hidden'
                    );

                }


                /*
                 * Message selon le rôle.
                 */

                if (currentRole === 'ADMINISTRATEUR') {

                    accessStatus.textContent =
                        'ACCÈS ADMINISTRATEUR — GESTION COMPLÈTE AUTORISÉE';

                }
                else if (currentRole === 'MANAGER ANIM') {

                    accessStatus.textContent =
                        'ACCÈS MANAGER ANIM — GESTION COMPLÈTE AUTORISÉE';

                }
                else if (currentRole === 'ANIMATION') {

                    accessStatus.textContent =
                        'ACCÈS ANIMATION — CRÉATION ET MODIFICATION AUTORISÉES';

                }


                eventsContent.classList.remove(
                    'hidden'
                );


                await loadReports();

            }
        );


        /* =========================================================
           CHARGEMENT DES RAPPORTS
        ========================================================== */

        async function loadReports() {

            const reportsList =
                document.getElementById(
                    'reportsList'
                );


            reportsList.innerHTML =
                '<div class="loading">CHARGEMENT DES RAPPORTS...</div>';


            const {
                data,
                error
            } =
                await supabaseClient
                    .from('event_reports')
                    .select('*')
                    .order(
                        'created_at',
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(
                    'ZONE-431 — Erreur chargement :',
                    error
                );


                reportsList.innerHTML =
                    `
                    <div class="error-box">
                        ERREUR LORS DU CHARGEMENT DES RAPPORTS.
                    </div>
                    `;

                return;
            }


            allReports = data || [];

            displayReports(allReports);
        }


        /* =========================================================
           AFFICHAGE DES RAPPORTS
        ========================================================== */

        function displayReports(reports) {

            const reportsList =
                document.getElementById(
                    'reportsList'
                );


            if (!reports || reports.length === 0) {

                reportsList.innerHTML =
                    `
                    <div class="empty-box">
                        AUCUN RAPPORT D'ÉVÉNEMENT DISPONIBLE.
                    </div>
                    `;

                return;
            }


            reportsList.innerHTML =
                reports
                    .map(
                        function (report, index) {

                            /*
                             * Boutons selon le rôle.
                             */

                            let reportActions = '';


                            /*
                             * ANIMATION :
                             * modifier uniquement.
                             *
                             * MANAGER ANIM :
                             * modifier + supprimer.
                             *
                             * ADMIN :
                             * modifier + supprimer.
                             */

                            if (
                                EDIT_ROLES.includes(
                                    currentRole
                                )
                            ) {

                                reportActions +=
                                    `
                                    <button
                                        type="button"
                                        onclick="editReport(${report.id})"
                                    >
                                        MODIFIER
                                    </button>
                                    `;
                            }


                            if (
                                DELETE_ROLES.includes(
                                    currentRole
                                )
                            ) {

                                reportActions +=
                                    `
                                    <button
                                        type="button"
                                        class="delete-action"
                                        onclick="deleteReport(${report.id})"
                                    >
                                        SUPPRIMER
                                    </button>
                                    `;
                            }


                            const actionsHTML =
                                reportActions
                                    ? `
                                    <div class="report-actions">
                                        ${reportActions}
                                    </div>
                                    `
                                    : '';


                            return `
                            <article class="report-card">

                                <div class="report-header">

                                    <div class="report-number">
                                        RAPPORT #${index + 1}
                                    </div>

                                    <div class="report-status">
                                        ${escapeHTML(
                                            report.statut || 'NON DÉFINI'
                                        )}
                                    </div>

                                </div>


                                <div class="report-info">

                                    <div class="report-info-item">

                                        <strong>
                                            ÉVÉNEMENT
                                        </strong>

                                        <span>
                                            ${escapeHTML(
                                                report.nom || '—'
                                            )}
                                        </span>

                                    </div>


                                    <div class="report-info-item">

                                        <strong>
                                            DATE
                                        </strong>

                                        <span>
                                            ${formatDate(
                                                report.date_event
                                            )}
                                        </span>

                                    </div>


                                    <div class="report-info-item">

                                        <strong>
                                            RESPONSABLE
                                        </strong>

                                        <span>
                                            ${escapeHTML(
                                                report.responsable || '—'
                                            )}
                                        </span>

                                    </div>


                                    <div class="report-info-item">

                                        <strong>
                                            PARTICIPANTS
                                        </strong>

                                        <span>
                                            ${report.participants || 0}
                                        </span>

                                    </div>

                                </div>


                                <div class="report-body">


                                    <div class="report-section">

                                        <div class="report-section-title">
                                            RÉSUMÉ
                                        </div>

                                        <p>
                                            ${escapeHTML(
                                                report.resume || '—'
                                            )}
                                        </p>

                                    </div>


                                    <div class="report-section">

                                        <div class="report-section-title">
                                            DÉROULEMENT
                                        </div>

                                        <p>
                                            ${escapeHTML(
                                                report.deroulement || '—'
                                            )}
                                        </p>

                                    </div>


                                    <div class="report-section report-incidents">

                                        <div class="report-section-title">
                                            INCIDENTS
                                        </div>

                                        <p>
                                            ${escapeHTML(
                                                report.incidents || 'Aucun incident signalé.'
                                            )}
                                        </p>

                                    </div>


                                    <div class="report-section report-comments">

                                        <div class="report-section-title">
                                            COMMENTAIRES
                                        </div>

                                        <p>
                                            ${escapeHTML(
                                                report.commentaires || '—'
                                            )}
                                        </p>

                                    </div>

                                </div>


                                ${actionsHTML}

                            </article>
                            `;

                        }
                    )
                    .join('');

        }


        /* =========================================================
           RECHERCHE
        ========================================================== */

        function searchReports() {

            const searchInput =
                document.getElementById(
                    'searchInput'
                );


            const search =
                searchInput.value
                    .trim()
                    .toLowerCase();


            if (!search) {

                displayReports(
                    allReports
                );

                return;
            }


            const filteredReports =
                allReports.filter(
                    function (report) {

                        return (

                            String(
                                report.nom || ''
                            )
                                .toLowerCase()
                                .includes(search)

                            ||

                            String(
                                report.responsable || ''
                            )
                                .toLowerCase()
                                .includes(search)

                            ||

                            String(
                                report.resume || ''
                            )
                                .toLowerCase()
                                .includes(search)

                            ||

                            String(
                                report.deroulement || ''
                            )
                                .toLowerCase()
                                .includes(search)

                            ||

                            String(
                                report.incidents || ''
                            )
                                .toLowerCase()
                                .includes(search)

                            ||

                            String(
                                report.commentaires || ''
                            )
                                .toLowerCase()
                                .includes(search)

                        );

                    }
                );


            displayReports(
                filteredReports
            );

        }


        /* =========================================================
           OUVRIR CRÉATION
        ========================================================== */

        function openCreateReport() {

            /*
             * ANIMATION, MANAGER ANIM et ADMIN
             * peuvent créer.
             */

            if (
                !EDIT_ROLES.includes(
                    currentRole
                )
            ) {
                return;
            }


            document
                .getElementById(
                    'eventReportForm'
                )
                .reset();


            document
                .getElementById(
                    'editingReportId'
                )
                .value = '';


            document
                .getElementById(
                    'reportModalTitle'
                )
                .textContent =
                    'NOUVEAU RAPPORT';


            document
                .getElementById(
                    'reportModal'
                )
                .classList.remove(
                    'hidden'
                );

        }


        /* =========================================================
           MODIFIER UN RAPPORT
        ========================================================== */

        function editReport(id) {

            /*
             * ANIMATION, MANAGER ANIM et ADMIN
             * peuvent modifier.
             */

            if (
                !EDIT_ROLES.includes(
                    currentRole
                )
            ) {
                return;
            }


            const report =
                allReports.find(
                    function (item) {
                        return item.id == id;
                    }
                );


            if (!report) {
                return;
            }


            document
                .getElementById(
                    'editingReportId'
                )
                .value =
                    report.id;


            document
                .getElementById(
                    'eventName'
                )
                .value =
                    report.nom || '';


            /*
             * Conversion de la date
             * YYYY-MM-DD
             */

            if (report.date_event) {

                const dateParts =
                    report.date_event
                        .split('-');


                if (dateParts.length === 3) {

                    document
                        .getElementById(
                            'eventYear'
                        )
                        .value =
                            Number(
                                dateParts[0]
                            );


                    document
                        .getElementById(
                            'eventMonth'
                        )
                        .value =
                            Number(
                                dateParts[1]
                            );


                    document
                        .getElementById(
                            'eventDay'
                        )
                        .value =
                            Number(
                                dateParts[2]
                            );

                }

            }


            document
                .getElementById(
                    'eventLeader'
                )
                .value =
                    report.responsable || '';


            document
                .getElementById(
                    'eventParticipants'
                )
                .value =
                    report.participants || 0;


            document
                .getElementById(
                    'eventSummary'
                )
                .value =
                    report.resume || '';


            document
                .getElementById(
                    'eventProgress'
                )
                .value =
                    report.deroulement || '';


            document
                .getElementById(
                    'eventIncidents'
                )
                .value =
                    report.incidents || '';


            document
                .getElementById(
                    'eventComments'
                )
                .value =
                    report.commentaires || '';


            document
                .getElementById(
                    'eventStatus'
                )
                .value =
                    report.statut || 'TERMINE';


            document
                .getElementById(
                    'reportModalTitle'
                )
                .textContent =
                    'MODIFIER LE RAPPORT';


            document
                .getElementById(
                    'reportModal'
                )
                .classList.remove(
                    'hidden'
                );

        }


        /* =========================================================
           SUPPRIMER UN RAPPORT
        ========================================================== */

        async function deleteReport(id) {

            /*
             * SEULS MANAGER ANIM ET ADMIN
             * peuvent supprimer.
             */

            if (
                !DELETE_ROLES.includes(
                    currentRole
                )
            ) {
                return;
            }


            const confirmed =
                confirm(
                    'Êtes-vous sûr de vouloir supprimer ce rapport ? Cette action est irréversible.'
                );


            if (!confirmed) {
                return;
            }


            const {
                error
            } =
                await supabaseClient
                    .from('event_reports')
                    .delete()
                    .eq('id', id);


            if (error) {

                console.error(
                    'ZONE-431 — Erreur suppression :',
                    error
                );


                alert(
                    'Erreur lors de la suppression du rapport.'
                );

                return;
            }


            await loadReports();

        }


        /* =========================================================
           ENREGISTRER / CRÉER / MODIFIER
        ========================================================== */

        async function saveReport(event) {

            event.preventDefault();


            /*
             * ANIMATION, MANAGER ANIM et ADMIN
             * peuvent créer et modifier.
             */

            if (
                !EDIT_ROLES.includes(
                    currentRole
                )
            ) {
                return;
            }


            const id =
                document
                    .getElementById(
                        'editingReportId'
                    )
                    .value;


            const eventDate =
                getEventDate();


            if (!eventDate) {

                alert(
                    'Veuillez entrer une date valide au format JJ / MM / AAAA.'
                );

                return;
            }


            const reportData = {

                nom:
                    document
                        .getElementById(
                            'eventName'
                        )
                        .value
                        .trim(),

                date_event:
                    eventDate,

                responsable:
                    document
                        .getElementById(
                            'eventLeader'
                        )
                        .value
                        .trim(),

                participants:
                    Number(
                        document
                            .getElementById(
                                'eventParticipants'
                            )
                            .value
                    ) || 0,

                resume:
                    document
                        .getElementById(
                            'eventSummary'
                        )
                        .value
                        .trim(),

                deroulement:
                    document
                        .getElementById(
                            'eventProgress'
                        )
                        .value
                        .trim(),

                incidents:
                    document
                        .getElementById(
                            'eventIncidents'
                        )
                        .value
                        .trim(),

                commentaires:
                    document
                        .getElementById(
                            'eventComments'
                        )
                        .value
                        .trim(),

                statut:
                    document
                        .getElementById(
                            'eventStatus'
                        )
                        .value

            };


            /*
             * MODIFICATION
             */

            if (id) {

                const {
                    error
                } =
                    await supabaseClient
                        .from('event_reports')
                        .update(
                            reportData
                        )
                        .eq(
                            'id',
                            id
                        );


                if (error) {

                    console.error(
                        'ZONE-431 — Erreur modification :',
                        error
                    );


                    alert(
                        'Erreur lors de la modification du rapport.'
                    );

                    return;
                }

            }


            /*
             * CRÉATION
             */

            else {

                const {
                    error
                } =
                    await supabaseClient
                        .from('event_reports')
                        .insert(
                            reportData
                        );


                if (error) {

                    console.error(
                        'ZONE-431 — Erreur création :',
                        error
                    );


                    alert(
                        'Erreur lors de la création du rapport.'
                    );

                    return;
                }

            }


            closeReportModal();

            await loadReports();

        }


        /* =========================================================
           RÉCUPÉRER LA DATE
        ========================================================== */

        function getEventDate() {

            const day =
                Number(
                    document
                        .getElementById(
                            'eventDay'
                        )
                        .value
                );


            const month =
                Number(
                    document
                        .getElementById(
                            'eventMonth'
                        )
                        .value
                );


            const year =
                Number(
                    document
                        .getElementById(
                            'eventYear'
                        )
                        .value
                );


            if (
                !day ||
                !month ||
                !year
            ) {
                return null;
            }


            if (
                day < 1 ||
                day > 31 ||
                month < 1 ||
                month > 12 ||
                year < 2020 ||
                year > 2100
            ) {
                return null;
            }


            const dayString =
                String(day)
                    .padStart(
                        2,
                        '0'
                    );


            const monthString =
                String(month)
                    .padStart(
                        2,
                        '0'
                    );


            return `${year}-${monthString}-${dayString}`;

        }


        /* =========================================================
           FORMAT DATE
        ========================================================== */

        function formatDate(date) {

            if (!date) {
                return '—';
            }


            const parts =
                String(date)
                    .split('-');


            if (parts.length !== 3) {
                return escapeHTML(date);
            }


            return `
                ${parts[2]}/${parts[1]}/${parts[0]}
            `;

        }


        /* =========================================================
           FERMER LA MODALE
        ========================================================== */

        function closeReportModal() {

            document
                .getElementById(
                    'reportModal'
                )
                .classList.add(
                    'hidden'
                );

        }


        /* =========================================================
           PROTECTION HTML
        ========================================================== */

        function escapeHTML(value) {

            return String(value ?? '')
                .replace(
                    /&/g,
                    '&amp;'
                )
                .replace(
                    /</g,
                    '&lt;'
                )
                .replace(
                    />/g,
                    '&gt;'
                )
                .replace(
                    /"/g,
                    '&quot;'
                )
                .replace(
                    /'/g,
                    '&#039;'
                );

        }

    </script>
